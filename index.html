<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jogszabálytár">
<meta name="theme-color" content="#0D1522">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<title>Jogszabálytár</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  --bg:#0D1522; --kartya:#16212F; --kartya2:#1B2840; --szegely:#26354A; --szegely-f:#32445C; --vonal:#213045;
  --nav:#101A28; --szoveg:#E6ECF4; --szoveg-f:#F2F6FB; --halv:#9DABBE; --halv2:#8797AC; --torzs:#DDE5EF; --torzs-h:#C3CEDC;
  --kiem:#8CC0FF; --kiem-bg:#1E3352; --kiem-bg2:#1B2D4A; --kiem-sz:#2F4B75; --aktiv:#1A2B46;
  --arany:#F2D27A; --arany-bg:#2E2A18; --arany-sz:#4D4423;
  --zold:#A9D8B8; --zold-bg:#1D2A22; --zold-sz:#2D4234;
  --torolt:#8E9CB0;
  --serif:'Source Serif 4', Georgia, 'Times New Roman', serif;
  --sans:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --betu:13px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--szoveg);font-family:var(--sans);font-size:13px}
body{overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--kiem);text-decoration:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#tartalom{padding:0 0 86px;min-height:100vh}
.oldal{padding:16px 16px 0;display:flex;flex-direction:column;gap:14px;max-width:720px;margin:0 auto}
.fejsor{display:flex;align-items:center;gap:10px}
.cim1{margin:0;font-family:var(--serif);font-weight:600;color:var(--szoveg-f);font-size:24px;line-height:1.15}
.alcim{margin:0;font-size:12px;color:var(--halv)}
.logo{width:44px;height:44px;flex:none;border-radius:12px;background:linear-gradient(180deg,#1E2C42,#131D2D);border:1px solid #2F4058;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 4px 10px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:22px;font-weight:600;color:var(--kiem)}
.ikongomb{width:44px;height:44px;flex:none;border-radius:12px;background:var(--kartya);border:1px solid var(--szegely);
  box-shadow:0 3px 8px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:var(--szoveg);padding:0}
.ikongomb.atlatszo{background:transparent;border:0;box-shadow:none;color:var(--torzs-h)}
.ikongomb.be{color:var(--kiem)}
.pirula{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:11px;white-space:nowrap;border:1px solid var(--szegely);background:var(--kartya);color:var(--torzs-h)}
.pirula.zold{background:var(--zold-bg);border-color:var(--zold-sz);color:var(--zold)}
.pirula.arany{background:var(--arany-bg);border-color:var(--arany-sz);color:var(--arany)}
.pirula.kek{background:var(--kiem-bg2);border-color:var(--kiem-sz);color:var(--kiem)}
.pont{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.chipek{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border-radius:8px;background:var(--kartya);border:1px solid var(--szegely);font-size:11px;color:var(--torzs-h)}
.chip.kiem{background:var(--kiem-bg2);border-color:var(--kiem-sz);color:var(--kiem)}
.kereso{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:14px;background:var(--kartya);border:1px solid var(--szegely);box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
.kereso input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--szoveg);font:inherit;font-size:13px}
.kereso input::placeholder{color:var(--halv2)}
.szekcio{display:flex;flex-direction:column;gap:8px}
.szekcio h2{margin:0 4px;font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--halv)}
.kartya{border-radius:16px;background:var(--kartya);border:1px solid var(--szegely);border-top-color:var(--szegely-f);box-shadow:0 6px 16px rgba(0,0,0,.35);overflow:hidden}
.sor{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;background:transparent;border:0;border-bottom:1px solid var(--vonal);text-align:left;color:var(--szoveg)}
.sor:last-child{border-bottom:0}
.sor .tobb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.sor .nev{font-family:var(--serif);font-size:15px;font-weight:600}
.sor .le{font-size:12px;color:var(--halv)}
.sor .kis{font-size:11px;color:var(--halv2)}
.sor .jel{padding:2px 7px;border-radius:6px;background:var(--kiem-bg);color:var(--kiem);font-size:10px;font-weight:600}
.sor.halvany .nev{color:var(--halv)}
.kiemelt{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:16px;background:linear-gradient(180deg,#1B2D4A,#15233A);
  border:1px solid var(--kiem-sz);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 8px 18px rgba(0,0,0,.4);color:var(--szoveg);text-align:left;width:100%}
.kiemelt .felso{display:flex;align-items:center;justify-content:space-between;font-size:11px}
.kiemelt .cimke{font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--kiem)}
.kiemelt .fo{font-size:14px;font-weight:500;line-height:1.35}
.kiemelt .le{font-size:12px;line-height:1.45;color:var(--torzs-h)}
.gomb{height:44px;padding:0 16px;border-radius:12px;background:var(--kartya);border:1px solid var(--szegely);border-top-color:var(--szegely-f);
  box-shadow:0 4px 12px rgba(0,0,0,.4);display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--szoveg);font-size:12px}
.gomb.kek{background:var(--kiem-bg2);border-color:var(--kiem-sz);color:var(--kiem);font-weight:500}
.gombsor{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.uzenet{padding:12px 14px;border-radius:12px;font-size:12px;line-height:1.45;background:var(--kartya);border:1px solid var(--szegely);color:var(--torzs-h)}
.uzenet.arany{background:var(--arany-bg);border-color:var(--arany-sz);color:var(--arany)}
.ures{padding:28px 10px;text-align:center;color:var(--halv);font-size:12px;line-height:1.5}
/* Jogszabály nézet */
.fej-gomb{width:100%;display:flex;align-items:center;gap:12px;padding:11px 14px;background:transparent;border:0;border-bottom:1px solid var(--vonal);color:var(--szoveg);text-align:left}
.fej-gomb .romai{width:32px;flex:none;font-family:var(--serif);font-size:13px;color:var(--halv2)}
.fej-gomb.nyitva{background:var(--kartya2)}
.fej-gomb.nyitva .romai{color:var(--kiem)}
.fej-gomb .tobb{flex:1;display:flex;flex-direction:column;gap:2px}
.fej-gomb .tobb span:first-child{font-size:13px}
.fej-gomb .tobb span:last-child{font-size:11px;color:var(--halv2)}
.cikklista{background:var(--kartya2);border-bottom:1px solid var(--vonal);padding:0 12px 8px 56px;display:flex;flex-direction:column}
.cikklista.lapos{padding-left:12px;background:transparent;border:0}
.cikksor{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 0;border:0;border-top:1px solid var(--szegely);background:transparent;color:var(--szoveg);text-align:left;width:100%}
.cikklista .cikksor:first-child{border-top:0}
.cikksor .sz{width:54px;flex:none;font-family:var(--serif);font-size:13px}
.cikksor .ci{flex:1;min-width:0;font-size:12px;color:var(--halv);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cikksor .mp{width:8px;height:8px;border-radius:50%;background:var(--kiem);flex:none}
/* Cikk nézet */
.cikkfej{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.cikkfej h1{margin:0;font-family:var(--serif);font-size:24px;font-weight:600;color:var(--szoveg-f)}
.cikkfej span{font-size:13px;color:var(--halv)}
.torzs{display:flex;flex-direction:column;gap:11px;font-family:var(--serif);font-size:var(--betu);line-height:1.5;color:var(--torzs)}
.torzs p{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.torzs p.pontos{padding-left:1.6em;text-indent:-1.6em}
.lablec{font-size:11px;line-height:1.45;color:var(--halv2);margin:0}
.lapozo{display:flex;justify-content:space-between;gap:10px}
.lapozo button{flex:1;height:46px;border-radius:12px;background:transparent;border:0;display:flex;align-items:center;gap:6px;padding:0 12px;color:var(--torzs-h);font-size:12px}
.lapozo button:last-child{justify-content:flex-end}
.lapozo button:disabled{opacity:.3}
mark{background:rgba(140,192,255,.22);color:inherit;border-radius:3px;padding:0 1px}
a.hiv{color:var(--kiem);text-decoration:underline;text-decoration-style:dotted;text-decoration-color:rgba(140,192,255,.6);text-underline-offset:3px}
.torzs p.villan{animation:villan 2.6s ease-out;border-radius:6px}
@keyframes villan{0%,30%{background:rgba(140,192,255,.22);box-shadow:0 0 0 6px rgba(140,192,255,.22)}100%{background:transparent;box-shadow:0 0 0 6px transparent}}
/* Változások */
.szurok{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.szurok::-webkit-scrollbar{display:none}
.szuro{height:36px;padding:0 14px;border-radius:18px;background:var(--kartya);border:1px solid var(--szegely);color:var(--torzs-h);font-size:12px;white-space:nowrap;flex:none}
.szuro.be{background:var(--kiem);border-color:var(--kiem);color:var(--bg);font-weight:600}
.idovonal{display:flex;flex-direction:column}
.idopont{display:flex;gap:14px}
.idopont .sav{display:flex;flex-direction:column;align-items:center;width:14px;flex:none}
.idopont .sav i{width:12px;height:12px;border-radius:50%;background:var(--kiem);box-shadow:0 0 0 4px rgba(140,192,255,.15);margin-top:4px}
.idopont .sav b{flex:1;width:2px;background:var(--szegely);margin-top:6px}
.idopont .test{flex:1;display:flex;flex-direction:column;gap:4px;padding-bottom:20px;min-width:0}
.idopont .datum{font-size:11px;color:var(--halv)}
.idopont .fo{font-size:13px;font-weight:500}
.idopont .le{font-size:12px;line-height:1.45;color:var(--torzs-h)}
.linkgomb{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;min-height:36px;background:transparent;border:0;padding:0;color:var(--kiem);font-size:12px;font-weight:500}
/* Különbség */
.diffblokk{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:var(--kartya);border:1px solid var(--szegely)}
.diffblokk h3{margin:0;font-family:var(--serif);font-size:17px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.diffblokk .torzs{font-size:calc(var(--betu) - 1px)}
del{color:var(--torolt);text-decoration:line-through;text-decoration-color:rgba(142,156,176,.8)}
ins{text-decoration:none;background:rgba(140,192,255,.16);color:var(--szoveg-f);border-bottom:1px solid rgba(140,192,255,.55)}
.valtozatok{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--kartya);border:1px solid var(--szegely);border-top-color:var(--szegely-f);box-shadow:0 6px 14px rgba(0,0,0,.35)}
.valtozatok div{flex:1;display:flex;flex-direction:column;gap:2px}
.valtozatok div:last-child{align-items:flex-end}
.valtozatok small{font-size:10px;color:var(--halv2);text-transform:uppercase;letter-spacing:.6px}
/* Alsó menü */
nav#menu{position:fixed;left:0;right:0;bottom:0;height:66px;padding:6px 12px 10px;background:var(--nav);border-top:1px solid var(--vonal);
  box-shadow:0 -10px 24px rgba(0,0,0,.5);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;z-index:5}
nav#menu button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:12px;background:transparent;border:0;color:var(--halv);font-size:11px}
nav#menu button.be{background:var(--aktiv);color:var(--kiem);font-weight:500}
nav#menu .szam{position:absolute;top:4px;left:54%;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--kiem);color:var(--bg);font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center}
.toltes{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px 0;color:var(--halv)}
.porgo{width:20px;height:20px;border-radius:50%;border:2px solid var(--szegely);border-top-color:var(--kiem);animation:porog 0.8s linear infinite}
@keyframes porog{to{transform:rotate(360deg)}}
/* ---- Betöltőképernyő ---- */
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(120% 80% at 50% 38%,#16243A 0%,#0D1522 62%);transition:opacity .45s ease,visibility .45s ease}
#splash.el{opacity:0;visibility:hidden;pointer-events:none}
#splash .s-logo{width:92px;height:92px;border-radius:24px;background:linear-gradient(180deg,#1E2C42,#131D2D);border:1px solid #2F4058;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 14px 34px rgba(0,0,0,.55),0 0 0 8px rgba(140,192,255,.05);
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:56px;font-weight:600;color:var(--kiem);
  animation:sBe .7s cubic-bezier(.2,.8,.2,1) both}
#splash .s-cim{margin:6px 0 0;font-family:var(--serif);font-size:26px;font-weight:600;color:var(--szoveg-f);letter-spacing:.2px;animation:sBe .7s .08s cubic-bezier(.2,.8,.2,1) both}
#splash .s-al{margin:-10px 0 0;font-size:12px;color:var(--halv);animation:sBe .7s .14s cubic-bezier(.2,.8,.2,1) both}
#splash .s-sav{width:148px;height:3px;border-radius:2px;background:#1E2C42;overflow:hidden;margin-top:14px;animation:sBe .7s .2s both}
#splash .s-sav i{display:block;width:40%;height:100%;border-radius:2px;background:var(--kiem);animation:sCsuszik 1.25s ease-in-out infinite}
#splash .s-allapot{min-height:16px;font-size:11px;color:var(--halv2);text-align:center;padding:0 24px;animation:sBe .7s .24s both}
#splash .s-lab{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:10px;color:#5C6B80;letter-spacing:.4px}
@keyframes sBe{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sCsuszik{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.25s;background:#22324A;color:var(--szoveg-f);
  padding:10px 16px;border-radius:12px;font-size:12px;box-shadow:0 8px 20px rgba(0,0,0,.5);z-index:9;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
#toast.lat{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---- iOS: biztonsági sávok (sziget, home csík) ---- */
:root{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sj:env(safe-area-inset-right,0px)}
#tartalom{padding:var(--st) var(--sj) calc(86px + var(--sb)) var(--sl)}
nav#menu{height:calc(66px + var(--sb));padding-bottom:calc(10px + var(--sb));padding-left:calc(12px + var(--sl));padding-right:calc(12px + var(--sj))}
#toast{bottom:calc(80px + var(--sb))}
#splash .s-lab{bottom:calc(22px + var(--sb))}
html,body{-webkit-touch-callout:none}
</style>
</head>
<body>
<div id="splash" role="status" aria-live="polite">
  <div class="s-logo" aria-hidden="true">§</div>
  <h1 class="s-cim">Jogszabálytár</h1>
  <p class="s-al">EU közúti szabályok, hatályos szöveggel</p>
  <div class="s-sav" aria-hidden="true"><i></i></div>
  <div class="s-allapot" id="splashAllapot">Indítás…</div>
  <div class="s-lab">Forrás: EUR-Lex · Hiteles szöveg az EU Hivatalos Lapjában</div>
</div>
<main id="tartalom" aria-live="polite"></main>
<nav id="menu" aria-label="Fő menü">
  <button type="button" data-nezet="tar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 012-2h12v16H6a2 2 0 00-2 2z"/><path d="M4 19V5"/><path d="M8 7h6"/></svg>Tár</button>
  <button type="button" data-nezet="kereses"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Keresés</button>
  <button type="button" data-nezet="valt"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Változások<span class="szam" id="valtSzam" hidden></span></button>
  <button type="button" data-nezet="kedv"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Kedvencek</button>
</nav>
<div id="toast" role="status"></div>
<script>
/* ===================== Jogszabálytár — app (iOS / PWA, build_ios.py készítette az app.html-ből) ===================== */
var JT = { api: '', lista: null, szovegek: {}, elozok: {}, nezet: null, elozmeny: [], frissitve: null, offline: false, kedvencek: [], szuro: 'mind', kereses: '', jogKereses: '', nyitott: {} };

var TAR = (function () {
  var mem = {};
  function ok() { try { var k = '__jt'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; } catch (e) { return false; } }
  var van = ok();
  return {
    get: function (k) { try { return van ? localStorage.getItem(k) : (k in mem ? mem[k] : null); } catch (e) { return mem[k] || null; } },
    set: function (k, v) { try { if (van) localStorage.setItem(k, v); else mem[k] = v; return true; } catch (e) { mem[k] = v; return false; } },
    del: function (k) { try { if (van) localStorage.removeItem(k); delete mem[k]; } catch (e) { } },
    tartos: van
  };
})();
function tarJson(k, alap) { try { var s = TAR.get(k); return s ? JSON.parse(s) : alap; } catch (e) { return alap; } }

/* ---- natív híd ---- */
function nativ(uzenet) {
  try { if (window.AppInventor && window.AppInventor.setWebViewString) { window.AppInventor.setWebViewString(''); window.AppInventor.setWebViewString(uzenet); return true; } } catch (e) { }
  return false;
}
function megnyit(url) { if (!url) return; if (!nativ('OPEN:' + url)) window.open(url, '_blank'); }

/* ---- segédek ---- */
function $(s) { return document.querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function huDatum(iso) { var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[1] + '.' + m[2] + '.' + m[3] + '.' : String(iso || ''); }
function ido(isoStr) {
  if (!isoStr) return '';
  var d = new Date(isoStr); if (isNaN(d)) return '';
  var ma = new Date(); var p = function (n) { return (n < 10 ? '0' : '') + n; };

/* ---- Kattintható hivatkozások a szövegben ----
   „8. cikk”, „8a. cikkének (2) bekezdése”, „e rendelet 7. cikke” → ugyanebben a jogszabályban;
   „a 165/2014/EU rendelet 3. cikke”, „az (EU) 2020/1054 rendelet 1. cikke” → másik jogszabály, ha benne van a tárban. */
var HIV_BETU = 'a-záéíóöőúüű';
var HIV_RE = new RegExp(
  '((?:\\(EU\\)\\s*)?\\d{1,4}\\/\\d{2,4}(?:\\/(?:EK|EGK|EU|Euratom))?\\s+(?:rendelet|irányelv|határozat)[' + HIV_BETU + ']*\\s+)?' +
  '(\\d{1,3}[a-z]?)\\.\\s*cikk([' + HIV_BETU + ']*)' +
  '(\\s*\\((\\d{1,2}[a-z]?)\\)(?:\\s*bekezdés[' + HIV_BETU + ']*)?)?', 'g');

  var m = String(s).match(/\(EU\)\s*(\d{4})\/(\d+)/) || String(s).match(/(\d{1,4})\/(\d{2,4})/);
  return m ? m[1] + '/' + m[2] : null;
}

  var t = (JT.lista ? JT.lista.jogszabalyok : []).filter(function (j) { return j.van && jogszabalySzam(j.nev) === szamPar; });
  return t.length ? t[0].kod : null;

    // vonatkozik, nem a módosító rendelet saját cikkére: ezeket nem linkeljük, nehogy rossz helyre vigyen.
    var sajat = jog(kod);
    if (!elotag && sajat && sajat.mod === 'eredeti') return egesz;
    if (elotag) {
      cel = kodSzamAlapjan(jogszabalySzam(elotag));
      if (!cel) return egesz;   // a tárban nem szereplő jogszabály: nem link
    }
    if (cel === kod && szam === aktSzam && !bek) return egesz;   // önmagára mutat
